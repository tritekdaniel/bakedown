<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bakedown — Recipe database and reader with AI transcoding. Store recipes as markdown, browse folders, and transcribe photos to markdown with local LLMs.">
  <meta name="keywords" content="recipes, cookbook, markdown, AI, transcode, LM Studio, flutter, PWA">
  <meta name="author" content="Bakedown">
  <meta name="theme-color" content="#E85D04">
  <meta name="color-scheme" content="light dark">

  <!-- Performance: preconnect to canvaskit CDN (if used) and preconnect for API -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bakedown">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/Icon-192.png">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bakedown — Recipe database & AI transcode">
  <meta property="og:description" content="Browse recipe folders, read markdown, and transcribe photos to markdown with local LLMs.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary_large_image">

  <title>Bakedown</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { background: #FFF8F0; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #FFF8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: opacity .35s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-icon { width: 72px; height: 72px; border-radius: 16px; background: #E85D04; display: grid; place-items: center; color: #fff; font-size: 36px; }
    .splash-title { margin-top: 16px; font-size: 20px; font-weight: 700; color: #1a1a1a; }
    .splash-sub { margin-top: 6px; font-size: 13px; color: #6b6b6b; }
    .splash-bar { margin-top: 18px; width: 120px; height: 3px; background: #f0d9c0; border-radius: 999px; overflow: hidden; }
    .splash-bar > span { display: block; width: 40%; height: 100%; background: #E85D04; animation: shimmer 1.1s infinite; border-radius: 999px; }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-icon">🍳</div>
    <div class="splash-title">Bakedown</div>
    <div class="splash-sub">Loading recipes…</div>
    <div class="splash-bar"><span></span></div>
  </div>

  <script>
    // Hide splash once Flutter first frame is rendered
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 400); }
    });
    // Fallback: hide after 8s even if event missed
    setTimeout(function(){
      var s = document.getElementById('splash');
      if (s && !s.classList.contains('hidden')) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 400); }
    }, 8000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <noscript><style>#splash{display:none}</style><p style="text-align:center;padding:32px">Please enable JavaScript to run Bakedown.</p></noscript>
</body>
</html>
